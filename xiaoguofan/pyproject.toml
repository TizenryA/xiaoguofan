[project]
name = "aistudio-portal"
version = "0.6.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "cryptography>=44,<49", "argon2-cffi>=23,<26"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 130
