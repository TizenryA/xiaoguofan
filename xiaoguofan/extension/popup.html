<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本人账号导入</title><link rel="stylesheet" href="popup.css"><script src="core.js" defer></script><script src="popup.js" defer></script></head><body><h1>导入专用 Google 账号</h1><p>先在当前标签页登录 Lite 门户，再打开本扩展。</p><p class="warning">将上传敏感登录会话，站点运营者可使用它访问你的 Google 账号。仅使用专用账号，并确认目标地址。</p><label>目标门户<input id="target" readonly></label><label>Google 邮箱<input id="email" type="email" maxlength="254" placeholder="此登录状态所属的 Google 邮箱" required></label><label>备注<input id="label" maxlength="80" value="我的专用账号"></label><label class="consent"><input id="consent" type="checkbox">我信任此站点，授权读取并上传本浏览器的 Google 登录状态。</label><button id="read">检查归属并读取登录状态</button><section id="preview" hidden><p id="identity"></p><p id="summary"></p><p>检查目标与本人身份无误后，再点上传。</p><button id="upload">确认上传到本人账号</button></section><p id="status" role="status">尚未读取任何 Cookie</p><p class="small">无自动上传、不保存凭据、不提供真实额度。上传成功不代表 Google 登录或生成可用。手机需要支持桌面扩展的浏览器。</p></body></html>
